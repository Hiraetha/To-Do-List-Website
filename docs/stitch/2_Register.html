<input class="w-full bg-surface-container-lowest font-body-md text-body-md text-on-surface px-3.5 py-2.5 rounded-lg shadow-[3px_3px_0px_#1c1b1b] focus:shadow-[5px_5px_0px_#1c1b1b] focus:outline-none transition-all placeholder:text-outline-variant" id="fullName" placeholder="Alex Morgan" required="" type="text"/>
</div>

<!-- Work Email Field -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-badge text-label-badge text-on-surface uppercase tracking-wider flex items-center justify-between" for="workEmail">

</label>

<input class="w-full bg-surface-container-lowest font-body-md text-body-md text-on-surface px-3.5 py-2.5 rounded-lg shadow-[3px_3px_0px_#1c1b1b] focus:shadow-[5px_5px_0px_#1c1b1b] focus:outline-none transition-all placeholder:text-outline-variant" id="workEmail" placeholder="alex@company.com" required="" type="email"/>

<!-- Password Field & Dynamic Strength Meter -->
<div class="flex flex-col gap-1.5 text-left">

          </label>
<span class="font-code-mono text-code-mono text-outline uppercase font-bold text-[11px]" id="strengthText">8+ Chars</span>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest font-body-md text-body-md text-on-surface px-3.5 py-2.5 rounded-lg shadow-[3px_3px_0px_#1c1b1b] focus:shadow-[5px_5px_0px_#1c1b1b] focus:outline-none transition-all placeholder:text-outline-variant pr-10" id="password" placeholder="Min. 8 characters" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-on-surface hover:text-primary transition-colors flex items-center" id="togglePasswordBtn" type="button">

</button>

<!-- Visual Segmented Strength Indicator Bar -->

<div class="h-2 rounded-full bg-surface-container-highest transition-colors duration-200" id="bar-3"></div>
<div class="h-2 rounded-full bg-surface-container-highest transition-colors duration-200" id="bar-4"></div>
</div>
</div>
<!-- Confirm Password Field -->

<div class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 flex items-center text-secondary" id="matchIndicator">

<span>Log in</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</a>
</p>

<!-- Interactive Logic for Password Feedback & Visibility -->
<script>
    (function() {
      const pwdInput = document.getElementById('password');
      const confirmPwdInput = document.getElementById('confirmPassword');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const eyeIcon = document.getElementById('pwdEyeIcon');
      const strengthText = document.getElementById('strengthText');
      const matchIndicator = document.getElementById('matchIndicator');
      
      const bars = [
        document.getElementById('bar-1'),
        document.getElementById('bar-2'),
        document.getElementById('bar-3'),
        document.getElementById('bar-4')
      ];

      // Password Toggle
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });

      // Real-time strength meter calculation
      pwdInput.addEventListener('input', function(e) {
        const val = e.target.value;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        bars.forEach((bar, idx) => {
          bar.className = 'h-2 rounded-full transition-colors duration-150 ';
          if (idx < score) {
            if (score <= 1) {
              bar.classList.add('bg-error');
            } else if (score <= 2) {
              bar.classList.add('bg-primary-container');
            } else {
              bar.classList.add('bg-secondary-container');
            }
          } else {
            bar.classList.add('bg-surface-container-highest');
          }
        });

        if (score === 0) {
          strengthText.textContent = 'Min. 8 chars';
          strengthText.className = 'font-code-mono text-code-mono text-outline uppercase font-bold text-[11px]';
        } else if (score === 1) {
          strengthText.textContent = 'Weak';
          strengthText.className = 'font-code-mono text-code-mono text-error uppercase font-bold text-[11px]';
        } else if (score <= 2) {
          strengthText.textContent = 'Medium';
          strengthText.className = 'font-code-mono text-code-mono text-primary uppercase font-bold text-[11px]';
        } else {
          strengthText.textContent = 'Ultra Strong';
          strengthText.className = 'font-code-mono text-code-mono text-secondary uppercase font-bold text-[11px]';
        }

        checkMatch();
      });

      // Password Confirmation match check
      function checkMatch() {
        if (confirmPwdInput.value && confirmPwdInput.value === pwdInput.value) {
          matchIndicator.classList.remove('hidden');
        } else {
          matchIndicator.classList.add('hidden');
        }
      }

      confirmPwdInput.addEventListener('input', checkMatch);
    })();
  </script>
