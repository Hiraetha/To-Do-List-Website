<!-- Decorative Floating Neo-Brutalist Badges / Stickers -->
<div class="hidden sm:flex absolute -top-8 -left-6 z-20 items-center gap-1.5 px-3 py-1.5 bg-[#FF8A80] text-on-surface font-label-badge text-label-badge uppercase tracking-wider rounded-lg shadow-[4px_4px_0px_#1c1b1b] transform -rotate-6 select-none pointer-events-none">

<span>100% FOCUSED</span>
</div>
<div class="hidden sm:flex absolute -bottom-5 -right-6 z-20 items-center gap-1.5 px-3 py-1.5 bg-tertiary-fixed text-on-tertiary-fixed font-label-badge text-label-badge uppercase tracking-wider rounded-lg shadow-[4px_4px_0px_#1c1b1b] transform rotate-3 select-none pointer-events-none">

</div>
<!-- Decorative Corner Stamp -->
<div class="hidden md:block absolute -top-10 -right-5 z-10 select-none pointer-events-none">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center shadow-[3px_3px_0px_#1c1b1b] rotate-12">
<span class="material-symbols-outlined text-[24px] text-on-surface" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>

<span>PRODUCTIVITY UNLOCKED</span>
</div>
<!-- Headings -->
<h1 class="font-headline-lg text-headline-lg font-black text-on-surface tracking-tight uppercase leading-tight mb-2">
      WELCOME BACK!
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mb-6">
      Let's get things done today. Enter your credentials to access your workspace.
    </p>
</header>
<!-- Login Form -->
<form class="flex flex-col w-full gap-4" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-badge text-label-badge text-on-surface uppercase tracking-wider flex items-center gap-1.5" for="emailInput">
<span class="material-symbols-outlined text-[15px] leading-none text-on-surface">mail</span>
        EMAIL ADDRESS
      </label>
<input class="w-full bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 px-4 py-3 rounded-lg shadow-[3px_3px_0px_#1c1b1b] focus:shadow-[5px_5px_0px_#1c1b1b] focus:outline-none transition-all" id="emailInput" placeholder="alex.designer@taskly.io" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-badge text-label-badge text-on-surface uppercase tracking-wider flex items-center gap-1.5" for="passwordInput">
<span class="material-symbols-outlined text-[15px] leading-none text-on-surface">lock</span>
          PASSWORD
        </label>
<a class="font-label-btn text-label-btn text-on-surface-variant hover:text-on-surface underline underline-offset-4 decoration-2 decoration-primary-container transition-colors" href="#forgot">
          Forgot password?
        </a>
</div>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 px-4 py-3 pr-12 rounded-lg shadow-[3px_3px_0px_#1c1b1b] focus:shadow-[5px_5px_0px_#1c1b1b] focus:outline-none transition-all" id="passwordInput" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-1.5 text-on-surface-variant hover:text-on-surface rounded transition-colors flex items-center justify-center" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px] leading-none" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center justify-between pt-1">
<label class="inline-flex items-center gap-2.5 cursor-pointer select-none group">
<input checked="" class="sr-only peer" id="rememberMe" type="checkbox"/>
<div class="w-5 h-5 rounded bg-surface-container-lowest flex items-center justify-center shadow-[2px_2px_0px_#1c1b1b] peer-checked:bg-secondary-fixed transition-colors">
<span class="material-symbols-outlined text-[16px] text-on-surface font-black hidden peer-checked:block">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface group-hover:text-primary transition-colors">
          Remember me for 30 days
        </span>
</label>
<!-- Active Sessions Status Pill -->
<span class="inline-flex items-center gap-1 font-code-mono text-code-mono text-on-surface-variant bg-surface-container px-2 py-0.5 rounded">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
        v2.4 ONLINE
      </span>
</div>
<!-- Primary Login Button -->
<button class="mt-2 w-full py-3.5 px-6 bg-primary-container text-on-surface font-label-btn text-label-btn uppercase tracking-wider rounded-lg shadow-[5px_5px_0px_#1c1b1b] hover:shadow-[7px_7px_0px_#1c1b1b] hover:-translate-x-0.5 hover:-translate-y-0.5 active:translate-x-1 active:translate-y-1 active:shadow-[0px_0px_0px_#1c1b1b] transition-all flex items-center justify-center gap-2" id="submitBtn" type="submit">
<span>LOG IN TO DASHBOARD</span>
<span class="material-symbols-outlined text-[18px] leading-none font-bold">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center justify-center my-6">
<div class="w-full h-[2px] bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface-container-lowest font-label-badge text-label-badge text-on-surface-variant tracking-wider uppercase">
      OR CONTINUE WITH
    </span>
</div>
<!-- Social Login Buttons -->
<div class="grid grid-cols-2 gap-3 w-full">
<!-- Google Login -->
<button class="w-full py-2.5 px-4 bg-surface-container-lowest hover:bg-surface-container-low text-on-surface font-label-btn text-label-btn rounded-lg shadow-[4px_4px_0px_#1c1b1b] hover:shadow-[5px_5px_0px_#1c1b1b] hover:-translate-y-0.5 active:translate-x-1 active:translate-y-1 active:shadow-[0px_0px_0px_#1c1b1b] transition-all flex items-center justify-center gap-2" type="button">
<svg class="w-4 h-4 shrink-0" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>GOOGLE</span>
</button>
<!-- GitHub Login -->
<button class="w-full py-2.5 px-4 bg-surface-container-lowest hover:bg-surface-container-low text-on-surface font-label-btn text-label-btn rounded-lg shadow-[4px_4px_0px_#1c1b1b] hover:shadow-[5px_5px_0px_#1c1b1b] hover:-translate-y-0.5 active:translate-x-1 active:translate-y-1 active:shadow-[0px_0px_0px_#1c1b1b] transition-all flex items-center justify-center gap-2" type="button">
<svg class="w-4 h-4 shrink-0 fill-on-surface" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
</svg>
<span>GITHUB</span>
</button>
</div>
<!-- Footer Link -->
<footer class="mt-6 pt-4 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      Don't have an account yet? 
      <a class="font-headline-sm text-label-btn text-on-surface underline underline-offset-4 decoration-[2.5px] decoration-secondary hover:text-secondary transition-colors" href="#register">
        Register here
      </a>
</p>
</footer>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordIcon = document.getElementById('passwordIcon');

    if (togglePasswordBtn && passwordInput && passwordIcon) {
      togglePasswordBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    if (loginForm && submitBtn) {
      loginForm.addEventListener('submit', function() {
        const originalContent = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>AUTHENTICATING...</span>';
        submitBtn.disabled = true;
        setTimeout(function() {
          submitBtn.innerHTML = originalContent;
          submitBtn.disabled = false;
        }, 1200);
      });
    }
  })();
</script></main></body></html>
